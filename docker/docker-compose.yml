# fresh gpu host to running training, see README.md, everything that must
# survive a recreate lives in DATA_DIR (mounted as /drive2)
services:
  # one shot, writes the ssh keys and the two supervisord programs that xgl
  # picks up, both backed by bootstrap.sh
  mcgym-init:
    container_name: mcgym-init
    image: busybox
    restart: "no"
    volumes:
    - '${DATA_DIR:-/data/Docker/data}/mcgym-init:/opt/init'
    command:
    - sh
    - -c
    - |
      set -e
      echo '${SSH_PUBLIC_KEYS:?set SSH_PUBLIC_KEYS in docker/.env}' | tr ';' '\n' > /opt/init/authorized_keys
      cat > /opt/init/mcgym-ssh.conf <<'EOF'
      [program:mcgym-ssh]
      command=/bin/bash /opt/mcgym/bootstrap.sh ssh
      directory=/home/ubuntu
      autostart=true
      autorestart=true
      priority=1
      stdout_logfile=/tmp/mcgym-ssh.log
      redirect_stderr=true
      EOF
      cat > /opt/init/mcgym-train.conf <<'EOF'
      [program:mcgym-train]
      command=/bin/bash /opt/mcgym/bootstrap.sh train
      directory=/home/ubuntu
      autostart=true
      autorestart=true
      startsecs=30
      priority=10
      stdout_logfile=/drive2/train.log
      redirect_stderr=true
      environment=REPO_URL="${REPO_URL:?set REPO_URL in docker/.env}",TASK="${TASK:-wood}",NUM_ENVS="${NUM_ENVS:-32}",AGENTS="${AGENTS:-64}",ROLLOUT="${ROLLOUT:-128}",MINIBATCH="${MINIBATCH:-16384}",EPOCHS="${EPOCHS:-2}",COHORTS="${COHORTS:-4}",SCALE="${SCALE:-3}",MONITOR_PORT="${MONITOR_PORT:-9080}"
      EOF
      chmod 600 /opt/init/authorized_keys
      chown -R 1000:1000 /opt/init
      echo 'mcgym-init done'

  xgl:
    container_name: xgl
    hostname: xgl
    depends_on:
      mcgym-init:
        condition: service_completed_successfully
    image: ghcr.io/selkies-project/nvidia-glx-desktop:latest
    runtime: nvidia
    # host networking makes this ports section decorative, selkies 8080,
    # monitor 9080 and dropbear 2222 bind on the host directly, port 22 on
    # the host ip is the host vm not the container
    ports:
    - '8080:8080'
    - '9080:9080'
    - '2222:2222'
    stdin_open: true
    tty: true
    cpus: ${CPUS:-12}
    mem_limit: ${MEM_LIMIT:-64g}
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids: ['${GPU_ID:-2}']
            capabilities: [gpu]
    tmpfs:
    - '/dev/shm:rw'
    volumes:
    - '${DATA_DIR:-/data/Docker/data}:/drive2'
    - './bootstrap.sh:/opt/mcgym/bootstrap.sh:ro'
    - '${DATA_DIR:-/data/Docker/data}/mcgym-init/mcgym-ssh.conf:/etc/supervisor/conf.d/mcgym-ssh.conf:ro'
    - '${DATA_DIR:-/data/Docker/data}/mcgym-init/mcgym-train.conf:/etc/supervisor/conf.d/mcgym-train.conf:ro'
    network_mode: 'host'
    environment:
    - TZ=UTC
    - DISPLAY_SIZEW=1920
    - DISPLAY_SIZEH=1080
    - DISPLAY_REFRESH=60
    - DISPLAY_DPI=96
    - DISPLAY_CDEPTH=24
    - VIDEO_PORT=DFP
    # container user password, also sudo-root inside
    - PASSWD=${PASSWD:?set PASSWD in docker/.env}
    - SELKIES_ENCODER=nvh264enc
    - SELKIES_ENABLE_RESIZE=false
    - SELKIES_VIDEO_BITRATE=30000
    - SELKIES_FRAMERATE=60
    - SELKIES_AUDIO_BITRATE=128000
    - SELKIES_ENABLE_BASIC_AUTH=true
    - SELKIES_ENABLE_HTTPS=false
