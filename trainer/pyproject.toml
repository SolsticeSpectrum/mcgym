[project]
name = "mcai-train"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcai_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
