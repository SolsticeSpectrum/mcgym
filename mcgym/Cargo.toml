[package]
name = "mcgym"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "fast headless vanilla faithful Minecraft RL gym on Pumpkin"

[lib]
name = "mcgym"
path = "src/lib.rs"

[[bin]]
name = "mcgym"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
