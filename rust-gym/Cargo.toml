[package]
name = "mcai-gym"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Fast headless Minecraft RL gym (Pumpkin-based) for the MCAI trainer"

[lib]
name = "mcai_gym"
path = "src/lib.rs"

[[bin]]
name = "mcai-gym"
path = "src/main.rs"

# Pumpkin world simulation is wired in once the codec + transport are proven.
# Kept out of the dependency graph for now so the contract layer builds in
# isolation (no asset/codegen cost) while it is the thing under test.
[dependencies]
memmap2 = "0.9"
# Pumpkin's vanilla world simulation (worldgen, chunks, blocks, lighting). Only the
# sim crates — never the `pumpkin` server binary (networking/commands/plugins).
# Pinned to the same rev as the reference/pumpkin clone so a bare `git clone` of
# this repo builds anywhere (no local reference checkout needed).
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "7bff068dff2f878fa2c7bfebb3bda97ddc17eb36" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
